<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Browser - LMApi</title>
  <link rel="stylesheet" href="styles/log-dashboard.css" />
  <style>
    /* ── Conversation Modal ───────────────────────────────────────── */
    #conv-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
    }
    #conv-modal.open {
      display: flex;
    }
    #conv-modal-panel {
      background: var(--bg, #1e1e2e);
      border: 1px solid var(--border, #313244);
      border-radius: 8px;
      width: 92vw;
      height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    #conv-modal-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border, #313244);
      flex-shrink: 0;
    }
    #conv-modal-title {
      flex: 1;
      font-weight: 600;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #conv-modal-download {
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid var(--border, #313244);
      background: transparent;
      color: inherit;
    }
    #conv-modal-download:hover { background: var(--border, #313244); }
    #conv-modal-close {
      padding: 0.3rem 0.7rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid var(--border, #313244);
      background: transparent;
      color: inherit;
      line-height: 1;
    }
    #conv-modal-close:hover { background: var(--border, #313244); }
    #conv-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .conv-msg {
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.55;
    }
    .conv-msg-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 0.3rem;
    }
    .conv-msg.role-system    { background: rgba(139,92,246,0.08); border-left: 3px solid #7c3aed; }
    .conv-msg.role-user      { background: rgba(59,130,246,0.08); border-left: 3px solid #3b82f6; }
    .conv-msg.role-assistant { background: rgba(34,197,94,0.08);  border-left: 3px solid #22c55e; }
    .conv-msg.role-tool      { background: rgba(251,146,60,0.08); border-left: 3px solid #f97316; }
    .conv-msg.role-thinking  { background: rgba(234,179,8,0.07);  border-left: 3px solid #ca8a04; }
    .conv-msg.role-toolcalls { background: rgba(236,72,153,0.07); border-left: 3px solid #db2777; }
  </style>
  <script src="socket.io/socket.io.js"></script>
  <script type="module">
    import { DashboardSocket } from './scripts/DashboardSocket.js';
    window.DashboardSocket = DashboardSocket;
  </script>
</head>
<body>
  <header class="page">
    <div>
      <div class="title">Prompt History</div>
      <div class="subtitle">Full table view with all columns and row expansion</div>
    </div>
    <div class="header-actions">
      <a href="dashboard" class="header-link">Dashboard</a>
      <a href="evaluator" class="header-link">Evaluator</a>
      <button id="refresh-btn" class="header-refresh-btn" title="Refresh all data">↻</button>
    </div>
  </header>

  <section class="panel">
    <div class="panel-head">
      <span>Prompt History</span>
      <span class="muted">Click a row to view the full conversation</span>
    </div>
    <div class="controls">
      <select id="filter-model" title="Filter by model">
        <option value="all">All models</option>
      </select>
      <select id="filter-server" title="Filter by server">
        <option value="all">All servers</option>
      </select>
      <select id="sort-field" title="Sort field">
        <option value="createdAt">Created date</option>
        <option value="responseDurationMs">Duration</option>
        <option value="serverName">Server name</option>
        <option value="modelName">Model name</option>
      </select>
      <select id="sort-dir" title="Sort direction">
        <option value="desc">Newest / High first</option>
        <option value="asc">Oldest / Low first</option>
      </select>
      <select id="page-size" title="Records per page">
        <option value="25">25 per page</option>
        <option value="50" selected>50 per page</option>
        <option value="100">100 per page</option>
        <option value="200">200 per page</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="history-browser-table">
        <thead>
          <tr>
            <th data-sort="id">ID</th>
            <th data-sort="serverName">Server</th>
            <th data-sort="modelName">Model</th>
            <th data-sort="responseDurationMs">Duration (s)</th>
            <th>Load (ms)</th>
            <th>Eval (ms)</th>
            <th>Total (ms)</th>
            <th>Tokens (In)</th>
            <th>Tokens (Out)</th>
            <th>Temp</th>
            <th data-sort="createdAt">Created</th>
            <th>Responded</th>
            <th>Error</th>
            <th>Group</th>
            <th>Prompt</th>
            <th>Response</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <div class="pagination">
      <button id="prev-page">Prev</button>
      <span class="muted" id="page-label">Page 1 of 1</span>
      <button id="next-page">Next</button>
      <span class="muted" id="history-count"></span>
    </div>
    <div class="error" id="history-error"></div>
  </section>

  <div id="toast" class="toast"></div>

  <!-- Full Conversation Modal -->
  <div id="conv-modal" role="dialog" aria-modal="true" aria-labelledby="conv-modal-title">
    <div id="conv-modal-panel">
      <div id="conv-modal-header">
        <span id="conv-modal-title"></span>
        <button id="conv-modal-download" title="Download conversation as .txt">Download .txt</button>
        <button id="conv-modal-close" title="Close (Esc)">✕</button>
      </div>
      <div id="conv-modal-body"></div>
    </div>
  </div>

  <script>
    const state = {
      history: [],
      totalHistory: 0,
      page: 1,
      pageSize: 50,
      sort: 'createdAt',
      dir: 'desc',
      filterModel: 'all',
      filterServer: 'all',
    };

    const qs = (sel) => document.querySelector(sel);
    const qsa = (sel) => Array.from(document.querySelectorAll(sel));

    const formatDate = (value) => {
      if (!value) return '—';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleString();
    };

    const formatDuration = (ms) => {
      if (ms === undefined || ms === null) return '—';
      return (ms / 1000).toFixed(2);
    };

    const truncate = (text, maxLength = 100) => {
      if (!text) return '—';
      const str = String(text);
      if (str.length <= maxLength) return str;
      return str.slice(0, maxLength) + '…';
    };

    const formatNanosToMs = (ns) => {
      if (ns === undefined || ns === null) return '—';
      return (ns / 1000000).toFixed(2);
    };

    const showToast = (msg) => {
      const el = qs('#toast');
      el.textContent = msg;
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 2200);
    };

    const fetchJson = async (url) => {
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`${res.status} ${res.statusText}`);
      }
      return res.json();
    };

    const loadHistory = async () => {
      const params = new URLSearchParams();
      params.set('limit', String(state.pageSize));
      params.set('page', String(state.page));
      params.set('sort', state.sort);
      params.set('dir', state.dir);
      if (state.filterModel !== 'all') params.set('model', state.filterModel);
      if (state.filterServer !== 'all') params.set('serverName', state.filterServer);

      try {
        const data = await fetchJson(`api/prompt-history?${params.toString()}`);
        const records = data.records || data.results || data.data || [];
        state.history = Array.isArray(records) ? records : [];
        state.totalHistory = Number(data.total || data.count || state.history.length) || state.history.length;
        renderHistory();
        renderFiltersFromHistory();
      } catch (err) {
        qs('#history-body').innerHTML = '';
        qs('#history-error').textContent = 'Failed to load prompt history: ' + err.message;
        console.error(err);
      }
    };

    const renderFiltersFromHistory = () => {
      const modelSelect = qs('#filter-model');
      const existingModel = modelSelect.value;
      const models = Array.from(new Set(state.history.map((r) => r.modelName).filter(Boolean))).sort();
      
      // Only update if we have new models or it's the first load
      if (models.length > 0 && modelSelect.options.length <= 1) {
        modelSelect.innerHTML = '<option value="all">All models</option>';
        models.forEach((m) => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          modelSelect.appendChild(opt);
        });
        if ([...modelSelect.options].some((o) => o.value === existingModel)) {
          modelSelect.value = existingModel;
        }
      }

      const serverSelect = qs('#filter-server');
      const existingServer = serverSelect.value;
      const servers = Array.from(new Set(state.history.map((r) => r.serverName).filter(Boolean))).sort();
      if (servers.length > 0 && serverSelect.options.length <= 1) {
        serverSelect.innerHTML = '<option value="all">All servers</option>';
        servers.forEach((s) => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          serverSelect.appendChild(opt);
        });
        if ([...serverSelect.options].some((o) => o.value === existingServer)) {
          serverSelect.value = existingServer;
        }
      }
    };

    // ── Conversation Modal ────────────────────────────────────────
    let currentConvText = null;
    let escListener = null;

    const closeConvModal = () => {
      qs('#conv-modal').classList.remove('open');
      qs('#conv-modal-body').innerHTML = '';
      currentConvText = null;
      if (escListener) {
        document.removeEventListener('keydown', escListener);
        escListener = null;
      }
    };

    const msgBlock = (label, content, roleClass) => {
      const div = document.createElement('div');
      div.className = `conv-msg ${roleClass}`;
      const lbl = document.createElement('div');
      lbl.className = 'conv-msg-label';
      lbl.textContent = label;
      const body = document.createElement('div');
      body.textContent = content;
      div.appendChild(lbl);
      div.appendChild(body);
      return div;
    };

    const openConvModal = (row) => {
      const modal = qs('#conv-modal');
      const modalBody = qs('#conv-modal-body');
      const title = qs('#conv-modal-title');

      title.textContent = `#${row.id}  ·  ${row.modelName || '—'}  ·  ${row.requestType || 'chat'}`;
      modalBody.innerHTML = '';

      const textParts = [];
      const frag = document.createDocumentFragment();

      // Parse messages array or fall back to synthetic prompt/response
      let messages = null;
      if (row.messages) {
        try { messages = JSON.parse(row.messages); } catch (_) { /* ignore */ }
      }

      if (messages && Array.isArray(messages) && messages.length > 0) {
        messages.forEach((msg) => {
          const role = (msg.role || 'unknown').toLowerCase();
          const roleClass = `role-${['system','user','assistant','tool'].includes(role) ? role : 'user'}`;
          let content = '';
          if (typeof msg.content === 'string') {
            content = msg.content;
          } else if (Array.isArray(msg.content)) {
            // multi-part content (vision, tool results, etc.)
            content = msg.content.map((part) => {
              if (typeof part === 'string') return part;
              if (part.type === 'text') return part.text || '';
              if (part.type === 'tool_result') return `[tool_result id=${part.tool_use_id}]\n${typeof part.content === 'string' ? part.content : JSON.stringify(part.content, null, 2)}`;
              return JSON.stringify(part, null, 2);
            }).join('\n');
          } else {
            content = JSON.stringify(msg.content, null, 2);
          }
          frag.appendChild(msgBlock(role.toUpperCase(), content, roleClass));
          textParts.push(`[${role.toUpperCase()}]\n${content}`);
        });
      } else {
        // generate-style or missing messages — show prompt + response
        if (row.prompt) {
          frag.appendChild(msgBlock('USER', row.prompt, 'role-user'));
          textParts.push(`[USER]\n${row.prompt}`);
        }
        if (row.responseText) {
          frag.appendChild(msgBlock('ASSISTANT', row.responseText, 'role-assistant'));
          textParts.push(`[ASSISTANT]\n${row.responseText}`);
        }
      }

      // Append thinking block if present
      if (row.thinking) {
        frag.appendChild(msgBlock('THINKING', row.thinking, 'role-thinking'));
        textParts.push(`[THINKING]\n${row.thinking}`);
      }

      // Append tool calls block if present
      if (row.toolCalls) {
        let toolText = row.toolCalls;
        try { toolText = JSON.stringify(JSON.parse(row.toolCalls), null, 2); } catch (_) { /* use raw */ }
        frag.appendChild(msgBlock('TOOL CALLS', toolText, 'role-toolcalls'));
        textParts.push(`[TOOL CALLS]\n${toolText}`);
      }

      if (frag.childElementCount === 0) {
        const empty = document.createElement('div');
        empty.className = 'muted';
        empty.textContent = 'No conversation content available.';
        frag.appendChild(empty);
      }

      modalBody.appendChild(frag);
      currentConvText = textParts.join('\n\n---\n\n');

      modal.classList.add('open');
      modalBody.scrollTop = 0;

      escListener = (e) => { if (e.key === 'Escape') closeConvModal(); };
      document.addEventListener('keydown', escListener);
    };

    // Download handler
    qs('#conv-modal-download').addEventListener('click', () => {
      if (!currentConvText) return;
      const titleText = qs('#conv-modal-title').textContent;
      const idMatch = titleText.match(/#(\d+)/);
      const id = idMatch ? idMatch[1] : 'conversation';
      const blob = new Blob([currentConvText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `conversation-${id}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    });

    qs('#conv-modal-close').addEventListener('click', closeConvModal);

    // Close on backdrop click
    qs('#conv-modal').addEventListener('click', (e) => {
      if (e.target === qs('#conv-modal')) closeConvModal();
    });

    const renderHistory = () => {
      const tbody = qs('#history-body');
      tbody.innerHTML = '';
      if (!state.history.length) {
        tbody.innerHTML = '<tr><td colspan="13" class="muted">No history yet.</td></tr>';
        qs('#history-count').textContent = '';
        qs('#page-label').textContent = 'Page 1 of 1';
        return;
      }

      const frag = document.createDocumentFragment();
      state.history.forEach((row) => {
        const tr = document.createElement('tr');
        const isPending = (row.responseDurationMs === null || row.responseDurationMs === undefined) && !row.isError;
        const isError = !!row.isError;

        if (isError) tr.classList.add('is-error');
        if (isPending) tr.classList.add('is-pending');
        if (row._isNew) tr.classList.add('row-highlight-new');
        if (row._isComplete) tr.classList.add('row-highlight-complete');

        const statusDotClass = isError ? 'dot-error' : (isPending ? 'dot-pending' : (row.serverName ? 'dot-ok' : 'dot-fail'));

        tr.innerHTML = `
          <td>${row.id}</td>
          <td><span class="status-dot ${statusDotClass}"></span>${row.serverName || '—'}</td>
          <td>${row.modelName || '—'}</td>
          <td>${isPending ? '...' : formatDuration(row.responseDurationMs)}</td>
          <td>${formatNanosToMs(row.loadDuration)}</td>
          <td>${formatNanosToMs(row.evalDuration)}</td>
          <td>${formatNanosToMs(row.totalDuration)}</td>
          <td>${row.inputTokens ?? '—'}</td>
          <td>${row.outputTokens ?? '—'}</td>
          <td>${row.temperature ?? '—'}</td>
          <td>${formatDate(row.createdAt)}</td>
          <td>${formatDate(row.responseAt)}</td>
          <td>${isError ? 'YES' : 'NO'}</td>
          <td title="${row.groupId || ''}">${row.groupId ? row.groupId.slice(0, 8) + '...' : '—'}</td>
          <td class="col-prompt">${truncate(row.prompt, 50)}</td>
          <td class="col-response">${isPending ? '...' : truncate(row.responseText, 50)}</td>
        `;

        tr.style.cursor = 'pointer';
        tr.addEventListener('click', () => openConvModal(row));
        frag.appendChild(tr);
      });
      tbody.appendChild(frag);

      const totalPages = Math.max(1, Math.ceil(state.totalHistory / state.pageSize));
      qs('#page-label').textContent = `Page ${state.page} of ${totalPages}`;
      qs('#prev-page').disabled = state.page <= 1;
      qs('#next-page').disabled = state.page >= totalPages;
      qs('#history-count').textContent = `${state.totalHistory} record(s)`;
    };

    const attachEvents = () => {
      qs('#refresh-btn').addEventListener('click', async () => {
        await loadHistory();
        showToast('Refreshed');
      });

      qs('#filter-model').addEventListener('change', () => {
        state.filterModel = qs('#filter-model').value;
        state.page = 1;
        loadHistory();
      });

      qs('#filter-server').addEventListener('change', () => {
        state.filterServer = qs('#filter-server').value;
        state.page = 1;
        loadHistory();
      });

      qs('#sort-field').addEventListener('change', () => {
        state.sort = qs('#sort-field').value;
        state.page = 1;
        loadHistory();
      });

      qs('#sort-dir').addEventListener('change', () => {
        state.dir = qs('#sort-dir').value;
        state.page = 1;
        loadHistory();
      });

      qs('#page-size').addEventListener('change', () => {
        state.pageSize = Number(qs('#page-size').value);
        state.page = 1;
        loadHistory();
      });

      qsa('th[data-sort]').forEach((th) => {
        th.addEventListener('click', () => {
          const field = th.dataset.sort;
          if (state.sort === field) {
            state.dir = state.dir === 'desc' ? 'asc' : 'desc';
          } else {
            state.sort = field;
            state.dir = 'desc';
          }
          qs('#sort-field').value = field;
          qs('#sort-dir').value = state.dir;
          loadHistory();
        });
      });

      qs('#prev-page').addEventListener('click', () => {
        if (state.page > 1) {
          state.page -= 1;
          loadHistory();
        }
      });

      qs('#next-page').addEventListener('click', () => {
        const totalPages = Math.max(1, Math.ceil(state.totalHistory / state.pageSize));
        if (state.page < totalPages) {
          state.page += 1;
          loadHistory();
        }
      });
    };

    const init = async () => {
      attachEvents();
      
      const setupSocket = () => {
        if (window.DashboardSocket) {
          const socketIoPath = new URL('socket.io/', document.baseURI).pathname;
          const socket = new window.DashboardSocket(undefined, { path: socketIoPath });
          socket.setupListeners({
            addHistoryRecord: (record) => {
              record._isNew = true;
              state.history.unshift(record);
              if (state.history.length > state.pageSize) {
                state.history.pop();
              }
              state.totalHistory++;
              renderHistory();
              setTimeout(() => {
                record._isNew = false;
                renderHistory();
              }, 1000);
            },
            updateHistoryRecord: (record) => {
              const idx = state.history.findIndex(r => r.id === record.id);
              if (idx !== -1) {
                const wasPending = (state.history[idx].responseDurationMs === null || state.history[idx].responseDurationMs === undefined) && !state.history[idx].isError;
                state.history[idx] = record;
                if (wasPending && !record.isError) {
                  record._isComplete = true;
                }
                renderHistory();
                setTimeout(() => {
                  record._isComplete = false;
                  renderHistory();
                }, 1000);
              }
            },
            loadHistory: () => loadHistory(),
            showToast: (msg) => showToast(msg),
          });
          return true;
        }
        return false;
      };

      if (!setupSocket()) {
        const interval = setInterval(() => {
          if (setupSocket()) clearInterval(interval);
        }, 100);
        setTimeout(() => clearInterval(interval), 5000);
      }

      await loadHistory();
    };

    init();
  </script>
</body>
</html>
